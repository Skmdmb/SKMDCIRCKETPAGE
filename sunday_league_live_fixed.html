<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunday League Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
        tr:hover { background: rgba(255,255,255,.04); }
        button:disabled { opacity: .45; cursor: not-allowed; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 selection:bg-yellow-500/30">
<nav class="p-4 flex justify-between items-center bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <h1 class="font-black italic text-yellow-500 tracking-tighter">SUNDAY LIVE</h1>
    <div class="flex gap-2">
        <button onclick="togglePoints()" class="text-[10px] bg-blue-600 px-3 py-2 rounded-full font-bold uppercase tracking-widest">🏆 Table</button>
        <button id="adminBtn" onclick="toggleAdmin()" class="text-[10px] bg-slate-700 px-3 py-2 rounded-full font-bold uppercase tracking-widest">🔐 Admin</button>
    </div>
</nav>

<main class="max-w-md mx-auto p-4">
    <div id="notice" class="hidden mb-3 rounded-xl p-3 text-xs font-bold"></div>
    <div id="appContainer">
        <div class="text-center py-20 text-slate-500 font-bold italic">Loading Tournament Data...</div>
    </div>
</main>

<script>
"use strict";

// ======================================
// CONFIGURATION
// ======================================
const ADMIN_PASS = "college123";
const API_URL = "https://api.npoint.io/4ccf228f6377d0c10aea";
const REFRESH_INTERVAL_MS = 5000;

const defaultState = () => ({
    tourneyName: "Sunday League Championship",
    status: "Upcoming",
    maxOvers: 5,
    runs: 0,
    wickets: 0,
    balls: 0,
    target: null,
    curInn: 1,
    batTeam: "",
    bowlTeam: "",
    curBat: "",
    matchEnded: false,
    players: [],
    sIdx: null,
    nsIdx: null,
    bIdx: null,
    overBalls: [],
    fallOfWickets: [],
    tournamentTeams: [],
    fixtures: [],
    points: {}
});

let state = defaultState();
let isAdmin = false;
let activeAdminTeam = "";
let isLoading = true;
let isSaving = false;
let refreshTimer = null;
let lastCloudUpdate = 0;
let showingPoints = false;

// ======================================
// SMALL UTILITIES
// ======================================
function showNotice(message, type = "info") {
    const el = document.getElementById("notice");
    el.textContent = message;
    el.className = "mb-3 rounded-xl p-3 text-xs font-bold " +
        (type === "error" ? "bg-red-900/60 text-red-200" :
         type === "success" ? "bg-green-900/60 text-green-200" :
         "bg-blue-900/60 text-blue-200");
    el.classList.remove("hidden");
    window.setTimeout(() => el.classList.add("hidden"), 3500);
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
}

function normalizeState(data) {
    const base = defaultState();
    const merged = { ...base, ...(data || {}) };

    merged.players = Array.isArray(merged.players) ? merged.players : [];
    merged.fixtures = Array.isArray(merged.fixtures) ? merged.fixtures : [];
    merged.tournamentTeams = Array.isArray(merged.tournamentTeams) ? merged.tournamentTeams : [];
    merged.points = merged.points && typeof merged.points === "object" ? merged.points : {};
    merged.overBalls = Array.isArray(merged.overBalls) ? merged.overBalls : [];
    merged.fallOfWickets = Array.isArray(merged.fallOfWickets) ? merged.fallOfWickets : [];

    // Support older saved documents that used the misspelled "wickers" property.
    if (typeof data?.wickets !== "number" && typeof data?.wickers === "number") {
        merged.wickets = data.wickers;
    }
    delete merged.wickers;

    return merged;
}

function currentPlayer(index) {
    return index === null || index === undefined ? null : state.players[index] || null;
}

function requireRoles(needs = ["striker", "bowler"]) {
    if (needs.includes("striker") && !currentPlayer(state.sIdx)) {
        alert("Assign a striker first.");
        return false;
    }
    if (needs.includes("non-striker") && !currentPlayer(state.nsIdx)) {
        alert("Assign a non-striker first.");
        return false;
    }
    if (needs.includes("bowler") && !currentPlayer(state.bIdx)) {
        alert("Assign a bowler first.");
        return false;
    }
    return true;
}

function isLegalDelivery() {
    state.balls += 1;
    const bowler = currentPlayer(state.bIdx);
    if (bowler) bowler.bb = (bowler.bb || 0) + 1;
}

function swapStrike() {
    const temp = state.sIdx;
    state.sIdx = state.nsIdx;
    state.nsIdx = temp;
}

function finishOverIfNeeded() {
    if (state.balls > 0 && state.balls % 6 === 0) {
        swapStrike();
        state.overBalls = [];
        state.bIdx = null; // Admin must select the next bowler.
    }
}

function recordBall(label) {
    state.overBalls.push(label);
}

function saveAndRender() {
    render();
    syncToCloud();
}

// ======================================
// CLOUD SYNC
// npoint documents are updated with PUT.
// ======================================
async function syncToCloud() {
    if (!isAdmin || isSaving) return;
    isSaving = true;
    try {
        const response = await fetch(API_URL, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(state)
        });

        if (!response.ok) {
            const message = await response.text();
            throw new Error(`Save failed (HTTP ${response.status}). ${message.slice(0, 180)}`);
        }
        lastCloudUpdate = Date.now();
        console.log("Tournament data saved to npoint.");
    } catch (error) {
        console.error("Cloud save error:", error);
        showNotice(error.message || "Unable to save changes to npoint.", "error");
    } finally {
        isSaving = false;
    }
}

async function autoRefresh() {
    if (isAdmin || isLoading && lastCloudUpdate !== 0) return;

    try {
        const response = await fetch(API_URL, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(`Unable to load npoint data (HTTP ${response.status}).`);
        }

        const data = await response.json();
        if (data && typeof data === "object" && !Array.isArray(data)) {
            state = normalizeState(data);
            lastCloudUpdate = Date.now();
            if (!isAdmin) render();
        }
    } catch (error) {
        console.error("Cloud refresh error:", error);
        if (isLoading) {
            showNotice("Could not load tournament data. Check the npoint URL and internet connection.", "error");
        }
    } finally {
        isLoading = false;
    }
}

// ======================================
// RENDER ROUTER
// ======================================
function render() {
    const container = document.getElementById("appContainer");

    if (showingPoints) {
        renderPointsTable(container);
        return;
    }

    if (isAdmin && state.tournamentTeams.length === 0) {
        renderSetup(container);
        return;
    }

    if (isAdmin && state.batTeam) {
        renderScoringDashboard(container);
        return;
    }

    if (isAdmin) {
        renderAdminDashboard(container);
        return;
    }

    renderViewerDashboard(container);
}

function renderSetup(container) {
    container.innerHTML = `
        <div class="bg-slate-800 p-6 rounded-[2.5rem] border border-slate-700 shadow-2xl space-y-6">
            <h2 class="text-xl font-black text-yellow-500 italic text-center uppercase tracking-wider">Tournament Setup</h2>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase mb-1">Tournament Name</label>
                <input id="tourneyNameInput" type="text" value="${escapeHtml(state.tourneyName)}"
                    class="w-full bg-slate-900 p-4 rounded-2xl text-sm font-bold border border-slate-700 outline-none">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase mb-1">Default Match Overs</label>
                <input id="defaultOversInput" type="number" value="${state.maxOvers}" min="1" max="50"
                    class="w-full bg-slate-900 p-4 rounded-2xl text-center text-xl font-bold border border-slate-700 text-yellow-500 outline-none">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase mb-1">Number of Teams</label>
                <input id="numTeamsInput" type="number" value="4" min="2" max="20"
                    class="w-full bg-slate-900 p-4 rounded-2xl text-center text-xl font-bold border border-slate-700 outline-none">
            </div>
            <button onclick="generateTeamInputsUI()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black uppercase text-xs tracking-widest">
                Next: Enter Team Names
            </button>
        </div>
        <div id="teamNamesStep" class="mt-4 space-y-4"></div>`;
}

function renderScoringDashboard(container) {
    if (!activeAdminTeam) activeAdminTeam = state.batTeam;

    const striker = currentPlayer(state.sIdx);
    const nonStriker = currentPlayer(state.nsIdx);
    const bowler = currentPlayer(state.bIdx);

    const squadHtml = state.players
        .map((player, index) => ({ player, index }))
        .filter(item => item.player.team === activeAdminTeam)
        .map(({ player, index }) => {
            const isBatting = player.team === state.curBat;
            return `
                <div class="flex justify-between items-center bg-slate-900 p-2 rounded-xl text-xs ${player.isOut ? "opacity-40" : ""}">
                    <span class="font-bold">${escapeHtml(player.name)}</span>
                    <div class="flex gap-1">
                        ${isBatting && !player.isOut && index !== state.sIdx && index !== state.nsIdx
                            ? `<button onclick="setPlayerRole(${index}, 'S')" class="text-[8px] bg-blue-900 px-2 py-1 rounded font-black">STR</button>
                               <button onclick="setPlayerRole(${index}, 'NS')" class="text-[8px] bg-slate-700 px-2 py-1 rounded font-black">NON</button>`
                            : ""}
                        ${!isBatting && !player.isOut && index !== state.bIdx
                            ? `<button onclick="setPlayerRole(${index}, 'B')" class="text-[8px] bg-red-900 px-2 py-1 rounded font-black">BOWL</button>`
                            : ""}
                    </div>
                </div>`;
        }).join("");

    container.innerHTML = `
        <div class="bg-slate-800 rounded-[2.5rem] p-6 shadow-2xl border-b-8 border-yellow-500 mb-6">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-black text-yellow-500 italic uppercase">${escapeHtml(state.curBat)}</h2>
                <div class="text-[9px] font-black uppercase bg-slate-900 px-3 py-1 rounded-full text-slate-400">Innings ${state.curInn}</div>
            </div>
            <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-6xl font-black tracking-tighter">${state.runs}/${state.wickets}</h2>
                    <p class="text-slate-400 font-bold text-sm">Overs:
                        <span class="text-white">${Math.floor(state.balls / 6)}.${state.balls % 6}</span> / ${state.maxOvers}
                    </p>
                </div>
                ${state.curInn === 2 ? `<div><p class="text-[9px] font-black text-slate-500 uppercase">Target</p><p class="text-3xl font-black text-blue-500">${state.target}</p></div>` : ""}
            </div>
            <div class="flex flex-wrap gap-2 mt-4">
                ${state.overBalls.map(ball => `<span class="bg-slate-700 px-2 py-1 rounded-full text-[10px] font-black">${escapeHtml(ball)}</span>`).join("")}
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-slate-800 p-4 rounded-3xl border-l-4 border-blue-500">
                <p class="text-[8px] text-blue-400 font-black mb-1 uppercase">Striker</p>
                <p class="font-bold truncate text-sm">${striker ? escapeHtml(striker.name) : "---"}</p>
                <p class="text-xl font-black">${striker ? `${striker.r}(${striker.b})` : "0(0)"}</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-3xl border-l-4 border-slate-600">
                <p class="text-[8px] text-slate-400 font-black mb-1 uppercase">Non-Striker</p>
                <p class="font-bold truncate text-sm">${nonStriker ? escapeHtml(nonStriker.name) : "---"}</p>
                <p class="text-xl font-black">${nonStriker ? `${nonStriker.r}(${nonStriker.b})` : "0(0)"}</p>
            </div>
            <div class="col-span-2 bg-slate-800 p-4 rounded-3xl border-l-4 border-red-500 flex justify-between items-center">
                <div>
                    <p class="text-[8px] text-red-400 font-black mb-1 uppercase">Bowler</p>
                    <p class="font-bold text-lg">${bowler ? escapeHtml(bowler.name) : "---"}</p>
                </div>
                <p class="text-xl font-black">${bowler ? `${Math.floor(bowler.bb / 6)}.${bowler.bb % 6} • ${bowler.rc}R • ${bowler.w}W` : "0.0 • 0R • 0W"}</p>
            </div>
        </div>

        <div class="space-y-4 mb-6 p-4 bg-slate-800 rounded-[2.5rem] border border-slate-700">
            <div class="grid grid-cols-4 gap-2">
                ${[0,1,2,3].map(run => `<button onclick="handleRun(${run})" class="bg-slate-900 h-12 rounded-xl font-bold">${run}</button>`).join("")}
                <button onclick="handleRun(4)" class="bg-blue-600 h-12 rounded-xl font-black">4</button>
                <button onclick="handleRun(6)" class="bg-green-600 h-12 rounded-xl font-black">6</button>
                <button onclick="handleWicket()" class="bg-red-600 h-12 rounded-xl font-black text-[10px]">WKT</button>
                <button onclick="handleWidePrompt()" class="bg-pink-600 h-12 rounded-xl text-[10px] font-black">W+</button>
                <button onclick="handleNoBallPrompt()" class="bg-purple-600 h-12 rounded-xl text-[10px] font-black col-span-2">NB+</button>
                <button onclick="handleRunOutPrompt()" class="bg-orange-600 h-12 rounded-xl text-[10px] font-black col-span-2">RUN OUT</button>
            </div>

            <div class="pt-2">
                <div class="flex bg-slate-900 p-1 rounded-xl mb-3">
                    <button onclick="switchAdminTeam('${escapeHtml(state.batTeam)}')" class="flex-1 py-2 rounded-lg text-[9px] font-black uppercase ${activeAdminTeam === state.batTeam ? "bg-blue-600 text-white" : "text-slate-400"}">${escapeHtml(state.batTeam)}</button>
                    <button onclick="switchAdminTeam('${escapeHtml(state.bowlTeam)}')" class="flex-1 py-2 rounded-lg text-[9px] font-black uppercase ${activeAdminTeam === state.bowlTeam ? "bg-blue-600 text-white" : "text-slate-400"}">${escapeHtml(state.bowlTeam)}</button>
                </div>
                <div class="flex gap-2 mb-3">
                    <input id="newPlayerName" type="text" placeholder="Player Name" class="flex-1 bg-slate-900 p-3 rounded-xl text-xs border border-slate-700 outline-none">
                    <button onclick="addPlayer()" class="bg-yellow-500 text-black px-4 rounded-xl font-black">+</button>
                </div>
                <div class="space-y-1 max-h-48 overflow-y-auto no-scrollbar">
                    ${squadHtml || `<p class="text-xs text-slate-500 text-center py-3">No players added for this team.</p>`}
                </div>
            </div>
            <button onclick="endMatchEarly()" class="w-full bg-slate-900 p-3 rounded-xl text-[9px] font-black text-yellow-500 uppercase border border-slate-700">Back to Fixtures / End Match</button>
        </div>`;
}

function renderAdminDashboard(container) {
    container.innerHTML = `
        <div class="bg-slate-800 p-6 rounded-[2.5rem] border border-slate-700 shadow-2xl space-y-6">
            <div class="text-center">
                <h2 class="text-xl font-black text-yellow-500 italic uppercase">${escapeHtml(state.tourneyName)}</h2>
                <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">Admin Dashboard • Status: <span class="text-white">${escapeHtml(state.status)}</span></p>
            </div>
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700 space-y-3">
                <h3 class="text-xs font-black text-blue-400 uppercase tracking-widest">Schedule New Match</h3>
                <div class="space-y-2">
                    <select id="schedTeamA" class="w-full bg-slate-800 p-3 rounded-xl text-xs font-bold border border-slate-700 outline-none">
                        ${state.tournamentTeams.map(team => `<option value="${escapeHtml(team)}">${escapeHtml(team)}</option>`).join("")}
                    </select>
                    <p class="text-[9px] font-black text-slate-600 text-center">VS</p>
                    <select id="schedTeamB" class="w-full bg-slate-800 p-3 rounded-xl text-xs font-bold border border-slate-700 outline-none">
                        ${state.tournamentTeams.map(team => `<option value="${escapeHtml(team)}">${escapeHtml(team)}</option>`).join("")}
                    </select>
                    <button onclick="createFixture()" class="w-full bg-green-600 text-white p-3 rounded-xl font-black uppercase text-[10px] tracking-widest">+ Add to Fixtures</button>
                </div>
            </div>
            <div>
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Tournament Fixtures</h3>
                <div class="space-y-2 max-h-60 overflow-y-auto no-scrollbar">
                    ${state.fixtures.length === 0
                        ? `<p class="text-xs text-slate-500 italic text-center py-4">No fixtures scheduled yet.</p>`
                        : state.fixtures.map((fixture, index) => `
                            <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex justify-between items-center text-xs">
                                <span class="font-bold">${escapeHtml(fixture.teamA)} vs ${escapeHtml(fixture.teamB)}</span>
                                <button onclick="startMatch(${index})" class="bg-blue-600 px-3 py-1 rounded-lg font-black text-[9px] uppercase">Start</button>
                            </div>`).join("")}
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="editTournamentName()" class="flex-1 bg-slate-900 text-yellow-400 p-3 rounded-xl text-[9px] font-black uppercase border border-slate-700">Edit Name</button>
                <button onclick="logoutAdmin()" class="flex-1 bg-slate-900 text-slate-300 p-3 rounded-xl text-[9px] font-black uppercase border border-slate-700">Logout</button>
            </div>
            <button onclick="fullReset()" class="w-full bg-red-900/20 text-red-500 p-3 rounded-xl font-black text-[9px] uppercase border border-red-900/30">⚠️ Reset Tournament</button>
        </div>`;
}

function renderViewerDashboard(container) {
    const live = Boolean(state.batTeam);
    container.innerHTML = `
        <div class="bg-slate-800 p-6 rounded-[2.5rem] border border-slate-700 text-center space-y-4 shadow-2xl">
            <h2 class="text-2xl font-black text-yellow-500 italic uppercase">${escapeHtml(state.tourneyName)}</h2>
            <p class="text-xs text-slate-400 font-bold">Tournament Status: <span class="text-white uppercase">${escapeHtml(state.status)}</span></p>
            ${live ? `
                <div class="bg-slate-900 p-5 rounded-2xl">
                    <p class="text-xs text-yellow-400 font-black uppercase">${escapeHtml(state.curBat)} • Innings ${state.curInn}</p>
                    <p class="text-5xl font-black mt-2">${state.runs}/${state.wickets}</p>
                    <p class="text-xs text-slate-400 mt-2">Overs ${Math.floor(state.balls / 6)}.${state.balls % 6} / ${state.maxOvers}</p>
                    ${state.curInn === 2 ? `<p class="text-sm text-blue-400 font-bold mt-2">Target: ${state.target}</p>` : ""}
                    <div class="flex flex-wrap justify-center gap-2 mt-3">
                        ${state.overBalls.map(ball => `<span class="bg-slate-700 px-2 py-1 rounded-full text-[10px] font-black">${escapeHtml(ball)}</span>`).join("")}
                    </div>
                </div>` : `<p class="text-xs text-slate-500 italic">Waiting for a live match...</p>`}
            <hr class="border-slate-700">
            <h3 class="text-xs text-slate-400 font-black uppercase tracking-widest">Fixtures</h3>
            <div class="space-y-2 text-left">
                ${state.fixtures.length
                    ? state.fixtures.map(f => `<div class="bg-slate-900 p-3 rounded-xl text-xs font-bold flex justify-between"><span>${escapeHtml(f.teamA)} vs ${escapeHtml(f.teamB)}</span><span class="text-slate-400">${escapeHtml(f.status || "Scheduled")}</span></div>`).join("")
                    : `<p class="text-xs text-slate-500 text-center">No fixtures scheduled yet.</p>`}
            </div>
        </div>`;
}

function renderPointsTable(container) {
    const rows = Object.entries(state.points || {}).map(([team, points]) => ({
        team, played: points.p || 0, wins: points.w || 0, losses: points.l || 0
    })).sort((a, b) => b.wins - a.wins || b.played - a.played);

    container.innerHTML = `
        <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-black text-yellow-500 uppercase italic">Points Table</h2>
                <button onclick="togglePoints()" class="bg-slate-700 px-3 py-2 rounded-lg text-xs font-bold">Back</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left">
                    <thead class="text-slate-400 uppercase"><tr><th class="p-2">Team</th><th class="p-2">P</th><th class="p-2">W</th><th class="p-2">L</th><th class="p-2">Pts</th></tr></thead>
                    <tbody>
                        ${rows.map(row => `<tr class="border-t border-slate-700"><td class="p-2 font-bold">${escapeHtml(row.team)}</td><td class="p-2">${row.played}</td><td class="p-2">${row.wins}</td><td class="p-2">${row.losses}</td><td class="p-2 font-black text-yellow-400">${row.wins * 2}</td></tr>`).join("")}
                    </tbody>
                </table>
            </div>
            ${rows.length ? "" : `<p class="text-center text-slate-500 text-xs py-5">No points available yet.</p>`}
        </div>`;
}

// ======================================
// TOURNAMENT SETUP & FIXTURES
// ======================================
function generateTeamInputsUI() {
    const numInput = document.getElementById("numTeamsInput");
    const oversInput = document.getElementById("defaultOversInput");
    const nameInput = document.getElementById("tourneyNameInput");
    const num = Number.parseInt(numInput.value, 10);
    const overs = Number.parseInt(oversInput.value, 10);

    if (!Number.isInteger(num) || num < 2 || num > 20) return alert("Enter a team count between 2 and 20.");
    if (!Number.isInteger(overs) || overs < 1 || overs > 50) return alert("Enter overs between 1 and 50.");

    state.tourneyName = nameInput.value.trim() || "Sunday League Championship";
    state.maxOvers = overs;

    const target = document.getElementById("teamNamesStep");
    let fields = "";
    for (let i = 1; i <= num; i++) {
        fields += `<input class="team-name-input w-full bg-slate-900 p-3 rounded-xl border border-slate-700 text-xs font-bold outline-none" placeholder="Team ${i} Name" value="Team ${i}">`;
    }
    target.innerHTML = `
        <div class="bg-slate-800 p-6 rounded-[2.5rem] border border-slate-700 space-y-4 shadow-2xl">
            <h3 class="text-sm font-black text-blue-400 uppercase italic text-center">Name Your Teams</h3>
            <div class="space-y-2 max-h-60 overflow-y-auto no-scrollbar">${fields}</div>
            <button onclick="saveTournamentSetup()" class="w-full bg-yellow-500 text-black p-4 rounded-2xl font-black uppercase text-xs tracking-widest">Save & Initialize Tournament</button>
        </div>`;
}

function saveTournamentSetup() {
    const inputs = [...document.querySelectorAll(".team-name-input")];
    const teams = inputs.map(input => input.value.trim());

    if (teams.some(name => !name)) return alert("Please enter every team name.");
    if (new Set(teams.map(name => name.toLowerCase())).size !== teams.length) {
        return alert("Team names must be unique.");
    }

    state.tournamentTeams = teams;
    state.points = {};
    teams.forEach(team => state.points[team] = { w: 0, l: 0, p: 0 });
    state.status = "Ongoing";
    saveAndRender();
}

function createFixture() {
    const teamA = document.getElementById("schedTeamA")?.value;
    const teamB = document.getElementById("schedTeamB")?.value;

    if (!teamA || !teamB) return alert("Add at least two teams first.");
    if (teamA === teamB) return alert("Team A and Team B cannot be the same.");

    state.fixtures.push({ teamA, teamB, overs: state.maxOvers, status: "Scheduled" });
    saveAndRender();
}

function startMatch(index) {
    const fixture = state.fixtures[index];
    if (!fixture) return;

    if (state.batTeam && !confirm("A match is already active. Replace the active match?")) return;

    state.batTeam = fixture.teamA;
    state.bowlTeam = fixture.teamB;
    state.curBat = fixture.teamA;
    state.maxOvers = Number(fixture.overs) || state.maxOvers;
    state.curInn = 1;
    state.runs = 0;
    state.wickets = 0;
    state.balls = 0;
    state.target = null;
    state.matchEnded = false;
    state.players = state.players.filter(player => player.team === fixture.teamA || player.team === fixture.teamB);
    state.sIdx = null;
    state.nsIdx = null;
    state.bIdx = null;
    state.overBalls = [];
    state.fallOfWickets = [];
    fixture.status = "Live";
    activeAdminTeam = state.batTeam;
    saveAndRender();
}

// ======================================
// PLAYER MANAGEMENT
// ======================================
function addPlayer() {
    const input = document.getElementById("newPlayerName");
    const name = input?.value.trim();
    if (!name) return alert("Enter a player name.");

    state.players.push({
        id: (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`),
        name,
        team: activeAdminTeam,
        r: 0, b: 0, isOut: false,
        w: 0, rc: 0, bb: 0
    });

    input.value = "";
    saveAndRender();
}

function setPlayerRole(index, role) {
    const player = state.players[index];
    if (!player || player.isOut) return;

    if (role === "S") {
        if (index === state.nsIdx) state.nsIdx = null;
        state.sIdx = index;
    } else if (role === "NS") {
        if (index === state.sIdx) state.sIdx = null;
        state.nsIdx = index;
    } else if (role === "B") {
        state.bIdx = index;
    }
    saveAndRender();
}

function switchAdminTeam(teamName) {
    activeAdminTeam = teamName;
    render();
}

// ======================================
// SCORING
// ======================================
function handleRun(runs) {
    if (!requireRoles(["striker", "non-striker", "bowler"])) return;

    const striker = currentPlayer(state.sIdx);
    const bowler = currentPlayer(state.bIdx);

    state.runs += runs;
    striker.r += runs;
    striker.b += 1;
    bowler.rc += runs;
    isLegalDelivery();
    recordBall(String(runs));

    if (runs % 2 !== 0) swapStrike();
    finishOverIfNeeded();
    checkMatchLogic();
    saveAndRender();
}

function handleWicket() {
    if (!requireRoles(["striker", "non-striker", "bowler"])) return;

    const striker = currentPlayer(state.sIdx);
    const bowler = currentPlayer(state.bIdx);

    const dismissal = prompt("Dismissal type (e.g. Bowled, Caught, LBW, Stumped):", "Bowled");
    if (dismissal === null) return;

    state.wickets += 1;
    bowler.w += 1;
    isLegalDelivery();
    striker.isOut = true;
    striker.dismissal = dismissal.trim() || "Wicket";
    state.fallOfWickets.push({ wicket: state.wickets, score: state.runs, player: striker.name, over: `${Math.floor(state.balls / 6)}.${state.balls % 6}` });
    recordBall("W");
    state.sIdx = null;

    finishOverIfNeeded();
    checkMatchLogic();
    saveAndRender();
}

function handleWidePrompt() {
    if (!requireRoles(["bowler"])) return;
    const total = Number.parseInt(prompt("Total wide runs to add to team and bowler (including the automatic wide):", "1"), 10);
    if (!Number.isInteger(total) || total < 1) return;

    state.runs += total;
    currentPlayer(state.bIdx).rc += total;
    recordBall(`W+${total}`);
    checkMatchLogic();
    saveAndRender();
}

function handleNoBallPrompt() {
    if (!requireRoles(["striker", "bowler"])) return;

    const total = Number.parseInt(prompt("Total runs to add for this no-ball (include the no-ball extra):", "1"), 10);
    if (!Number.isInteger(total) || total < 1) return;

    const batterRuns = Number.parseInt(prompt("How many of those runs were scored by the batter?", "0"), 10);
    if (!Number.isInteger(batterRuns) || batterRuns < 0 || batterRuns > total) return alert("Invalid batter runs.");

    state.runs += total;
    currentPlayer(state.sIdx).r += batterRuns;
    currentPlayer(state.bIdx).rc += total;
    currentPlayer(state.sIdx).b += 1;
    recordBall(`NB+${total}`);
    if (batterRuns % 2 !== 0) swapStrike();

    checkMatchLogic();
    saveAndRender();
}

function handleRunOutPrompt() {
    if (!requireRoles(["striker", "non-striker", "bowler"])) return;

    const completedRuns = Number.parseInt(prompt("Completed runs (0 or more):", "0"), 10);
    if (!Number.isInteger(completedRuns) || completedRuns < 0) return;

    const outType = prompt("Who got out? Enter S for striker or NS for non-striker:", "S");
    if (outType === null) return;
    const normalized = outType.trim().toUpperCase();
    if (normalized !== "S" && normalized !== "NS") return alert("Enter S or NS.");

    const outIndex = normalized === "S" ? state.sIdx : state.nsIdx;
    const outPlayer = currentPlayer(outIndex);
    const bowler = currentPlayer(state.bIdx);

    state.runs += completedRuns;
    state.wickets += 1;
    isLegalDelivery();
    outPlayer.isOut = true;
    outPlayer.dismissal = "Run Out";
    state.fallOfWickets.push({ wicket: state.wickets, score: state.runs, player: outPlayer.name, over: `${Math.floor(state.balls / 6)}.${state.balls % 6}` });
    recordBall(`${completedRuns}+RO`);

    if (completedRuns % 2 !== 0) swapStrike();
    if (normalized === "S") state.sIdx = null;
    else state.nsIdx = null;

    // A run out is not credited as a bowler wicket.
    void bowler;

    finishOverIfNeeded();
    checkMatchLogic();
    saveAndRender();
}

// ======================================
// INNINGS / MATCH FLOW
// ======================================
function checkMatchLogic() {
    const oversDone = state.balls >= state.maxOvers * 6;
    const allOut = state.wickets >= 10;

    if (state.curInn === 2 && state.runs >= state.target) {
        finishMatch(state.curBat);
        return;
    }

    if (oversDone || allOut) {
        if (state.curInn === 1) {
            state.target = state.runs + 1;
            state.curInn = 2;
            state.curBat = state.bowlTeam;
            state.runs = 0;
            state.wickets = 0;
            state.balls = 0;
            state.sIdx = null;
            state.nsIdx = null;
            state.bIdx = null;
            state.overBalls = [];
            alert(`Innings 1 complete. Target: ${state.target}`);
        } else {
            const winner = state.runs === state.target - 1 ? null : state.batTeam;
            finishMatch(winner);
        }
    }
}

function finishMatch(winner) {
    state.matchEnded = true;
    const fixture = state.fixtures.find(item =>
        item.teamA === state.batTeam && item.teamB === state.bowlTeam &&
        item.status === "Live"
    );

    if (winner) {
        const loser = winner === state.batTeam ? state.bowlTeam : state.batTeam;
        if (state.points[winner]) {
            state.points[winner].w += 1;
            state.points[winner].p += 1;
        }
        if (state.points[loser]) {
            state.points[loser].l += 1;
            state.points[loser].p += 1;
        }
        if (fixture) fixture.status = `Completed - ${winner} won`;
        alert(`Match over! Winner: ${winner}`);
    } else {
        if (fixture) fixture.status = "Completed - Tie";
        alert("Match tied. This version records the tie; Super Over is not implemented in this file.");
    }

    state.batTeam = "";
    state.bowlTeam = "";
    state.curBat = "";
    syncToCloud();
    render();
}

function endMatchEarly() {
    if (state.batTeam) {
        const fixture = state.fixtures.find(item =>
            item.teamA === state.batTeam && item.teamB === state.bowlTeam && item.status === "Live"
        );
        if (fixture) fixture.status = "Paused";
    }
    state.batTeam = "";
    state.bowlTeam = "";
    state.curBat = "";
    saveAndRender();
}

// ======================================
// ADMIN / NAVIGATION
// ======================================
function editTournamentName() {
    const name = prompt("Tournament name:", state.tourneyName);
    if (name === null || !name.trim()) return;
    state.tourneyName = name.trim();
    saveAndRender();
}

function togglePoints() {
    showingPoints = !showingPoints;
    render();
}

function toggleAdmin() {
    if (isAdmin) {
        logoutAdmin();
        return;
    }

    const pin = prompt("Admin PIN:");
    if (pin === ADMIN_PASS) {
        isAdmin = true;
        showingPoints = false;
        document.getElementById("adminBtn").textContent = "🔓 ADMIN";
        activeAdminTeam = state.batTeam || "";
        render();
    } else if (pin !== null) {
        alert("Incorrect PIN.");
    }
}

function logoutAdmin() {
    isAdmin = false;
    activeAdminTeam = "";
    document.getElementById("adminBtn").textContent = "🔐 Admin";
    render();
}

async function fullReset() {
    if (!confirm("Delete/reset the entire tournament? This cannot be undone.")) return;
    state = defaultState();
    activeAdminTeam = "";
    showingPoints = false;
    await syncToCloud();
    render();
}

// ======================================
// STARTUP
// ======================================
window.addEventListener("DOMContentLoaded", async () => {
    await autoRefresh();
    render();
    refreshTimer = window.setInterval(autoRefresh, REFRESH_INTERVAL_MS);
});

window.addEventListener("beforeunload", () => {
    if (refreshTimer) window.clearInterval(refreshTimer);
});
</script>
</body>
</html>
